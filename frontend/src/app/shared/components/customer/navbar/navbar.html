<aside class="loan-sidebar">

  <div class="sidebar-brand">
    <i class="bi bi-person"></i>
    <h3>User</h3>
  </div>

  <nav class="sidebar-menu">

    <!-- Customer -->
    <button class="menu-link menu-toggle"
            type="button"
            (click)="toggleMenu('customer')">

      <i class="bi bi-person-lines-fill"></i>
      <span>Customer</span>

      <i class="bi bi-chevron-down arrow"
         [class.rotated]="openMenu === 'customer'"></i>
    </button>

    <div class="submenu"
         [class.show]="openMenu === 'customer'">

      <a routerLink="/customer/cibil/scorecard"
         routerLinkActive="selected">
        <i class="bi bi-person"></i>
        <span>Profile / CIBIL Scorecard</span>
      </a>

      <a routerLink="/customer/cibil/history"
         routerLinkActive="selected">
        CIBIL History
      </a>

      <a routerLink="/customer/cibil/eligibility"
         routerLinkActive="selected">
        Eligibility Result
      </a>

    </div>

    <!-- Loan Services -->
    <button class="menu-link menu-toggle"
            type="button"
            (click)="toggleMenu('loan')">

      <i class="bi bi-cash-stack"></i>
      <span>Loan Services</span>

      <i class="bi bi-chevron-down arrow"
         [class.rotated]="openMenu === 'loan'"></i>
    </button>

    <div class="submenu"
         [class.show]="openMenu === 'loan'">

      <!-- Existing teammate routes retained -->
      <a routerLink="/loan-officer/loan-deals">
        Apply Loan
      </a>

      <a routerLink="/loan-officer/deal-review">
        Track Status
      </a>

      <!-- Customer foreclosure route -->
      <a routerLink="/customer/foreclosure/request"
         routerLinkActive="selected">
        Foreclosure Request
      </a>

      <a routerLink="/customer/loan-closure"
         routerLinkActive="selected">
        Loan Closure
      </a>

      <a routerLink="/customer/loan-closure/history"
         routerLinkActive="selected">
        Loan Closure History
      </a>

    </div>

    <!-- Payments -->
    <button class="menu-link menu-toggle"
            type="button"
            (click)="toggleMenu('payment')">

      <i class="bi bi-credit-card"></i>
      <span>Payments</span>

      <i class="bi bi-chevron-down arrow"
         [class.rotated]="openMenu === 'payment'"></i>
    </button>

    <div class="submenu"
         [class.show]="openMenu === 'payment'">

      <!-- Existing teammate routes retained -->
      <a routerLink="/customer/dashboard/emi-scheduler">
        EMI Schedules
      </a>

      <a routerLink="/loan-officer/payments">
        Loan Payments
      </a>

      <a routerLink="/customer/foreclosure/request"
         routerLinkActive="selected">
        Foreclosure Request
      </a>

    </div>

    <!-- Support Ticket -->
    <a routerLink="/loan-officer/support" class="menu-link">
      <i class="bi bi-ticket-perforated"></i>
      <span>Support Ticket</span>
    </a>

    <!-- Logout: existing link retained, logout logic not changed -->
    <a routerLink="/loan-officer/support" class="menu-link">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>

  </nav>
</aside>
