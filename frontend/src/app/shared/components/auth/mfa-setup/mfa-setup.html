<main class="auth-shell"><section class="auth-card"><a routerLink="/login" class="brand">LoanDesk</a><p class="eyebrow">FIRST-TIME SECURITY SETUP</p><h1>Set up authenticator</h1><p class="muted">Scan this QR code using Google Authenticator or Microsoft Authenticator.</p><p class="account" *ngIf="email">Account: {{email}}</p><p class="alert error" *ngIf="error">{{error}}</p><p class="alert success" *ngIf="notice">{{notice}}</p><div class="qr-wrap" *ngIf="qrCodeDataUrl"><img [src]="qrCodeDataUrl" alt="Authenticator QR code"><p>Scan the QR code with your authenticator app.</p></div><p class="muted" *ngIf="!qrCodeDataUrl && loading">Loading QR code…</p><details *ngIf="setupUri"><summary>Cannot scan? Show setup link</summary><textarea readonly [value]="setupUri"></textarea><button type="button" class="secondary" (click)="copySetupUri()">Copy setup link</button></details><form (ngSubmit)="verifySetup()"><label for="otp">Enter the 6-digit code from the app</label><input id="otp" name="otp" [(ngModel)]="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" required><button class="primary" type="submit" [disabled]="loading">{{loading?'Verifying…':'Verify and continue'}}</button></form></section></main>
