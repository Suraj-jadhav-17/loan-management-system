<main class="auth-shell"><section class="auth-card"><a routerLink="/login" class="brand">LoanDesk</a><p class="eyebrow">TWO-FACTOR AUTHENTICATION</p><h1>Verify your identity</h1><p class="muted">Enter the current 6-digit code from your authenticator app.</p><p class="account" *ngIf="email">Account: {{email}}</p><p class="alert error" *ngIf="error">{{error}}</p><form (ngSubmit)="verify()"><label for="otp">Authenticator code</label><input id="otp" name="otp" [(ngModel)]="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" required><button class="primary" type="submit" [disabled]="loading">{{loading?'Verifying…':'Verify and sign in'}}</button></form><a class="back" routerLink="/mfa-recovery">Lost access to your phone? Recover by email</a></section></main>
