<main class="auth-shell"><section class="auth-card"><a routerLink="/login" class="brand">LoanDesk</a><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Lost your authenticator?</h1><p class="muted">We will send a recovery OTP to your registered email. After verification, you can scan a new authenticator QR code.</p><p class="account" *ngIf="email">Account: {{email}}</p><p class="alert error" *ngIf="error">{{error}}</p><p class="alert success" *ngIf="notice">{{notice}}</p><button class="primary" type="button" (click)="requestOtp()" [disabled]="loading||requested">{{loading?'Sending…':requested?'Recovery OTP sent':'Send recovery OTP'}}</button><form *ngIf="requested" (ngSubmit)="verifyOtp()"><label for="otp">Email recovery OTP</label><input id="otp" name="otp" [(ngModel)]="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" required><p class="muted small">The recovery OTP expires in 5 minutes.</p><button class="primary" type="submit" [disabled]="loading">{{loading?'Verifying…':'Verify and set up new QR'}}</button></form><a class="back" routerLink="/mfa">Back to authenticator verification</a></section></main>
