<main class="auth-page"><section class="auth-card"><div class="brand-mark">LM</div><p class="eyebrow">LOAN MANAGEMENT SYSTEM</p><h1>Welcome back</h1><p class="subtext">Sign in to continue to your account.</p><form (ngSubmit)="login()"><label for="email">Email address</label><input id="email" name="email" type="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" [(ngModel)]="password" placeholder="Enter your password" autocomplete="current-password" required><p class="message" *ngIf="message">{{ message }}</p><button type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign in' }}</button></form><p class="footnote">New here? <a routerLink="/register">Create an account</a></p></section></main>
